# the repository; when it arrives, paste each item's text here (or provide the docx and run the
# builder with --docx: it lists the paragraphs so the quotes can be copied). Until then the
# builder prints "[verbatim reviewer text — to be pasted from docs/Hakem_revizyonları.docx]" and
# shows `paraphrase` (from the technical audit and the task document) in its place.
# `owner`: technical (answered from outputs/) or clinical (text from the clinical team).
