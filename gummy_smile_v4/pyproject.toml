[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsv4"
version = "0.1.0"
description = "Gingival display measurement and decision-support pipeline (v4 rewrite)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["gsv4*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
